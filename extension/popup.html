<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        width: 280px;
        padding: 14px;
        background: #0b0d14;
        color: #e8eaf2;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      h1 { margin: 0 0 2px; font-size: 14px; letter-spacing: -0.01em; }
      p { margin: 0; color: #9aa3b5; font-size: 11.5px; }
      .status { display: flex; align-items: center; gap: 6px; margin: 10px 0 12px; font-size: 11.5px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; }
      .dot.connected { background: #3fdc9c; box-shadow: 0 0 8px rgba(63, 220, 156, 0.7); }
      .dot.disconnected { background: #ffb266; }
      label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: #9aa3b5; margin-bottom: 4px; }
      input {
        width: 100%; box-sizing: border-box; height: 30px; padding: 0 9px;
        border-radius: 8px; border: 1px solid #2a2d3e; background: #12141c; color: #e8eaf2; font: inherit;
      }
      .row { display: flex; gap: 6px; margin-top: 10px; }
      button {
        flex: 1; height: 30px; border-radius: 8px; border: 1px solid #2a2d3e;
        background: rgba(255, 255, 255, 0.05); color: #e8eaf2; font: inherit; font-weight: 600; cursor: pointer;
      }
      button.primary { background: linear-gradient(135deg, #8b6cff, #6f8cff); border-color: transparent; }
      .hint { margin-top: 10px; font-size: 10.5px; color: #6f7890; }
    </style>
  </head>
  <body>
    <h1>Orbit browser control</h1>
    <p>Orbit acts in the tab you allow — after you approve each action.</p>

    <div class="status"><span class="dot" id="dot"></span><span id="state">Checking…</span></div>

    <label for="api">Orbit API</label>
    <input id="api" type="url" placeholder="http://localhost:8000" spellcheck="false" />

    <div class="row">
      <button class="primary" id="save">Save &amp; connect</button>
      <button id="reconnect">Reconnect</button>
    </div>

    <p class="hint">
      Clicks, typing and navigation always wait for your approval in the chat. Reads (snapshots,
      screenshots) run straight away.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
